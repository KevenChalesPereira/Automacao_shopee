name: Ze Curioso Studio Dynamic

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  render-dynamic:
    if: startsWith(github.event.issue.title, '[Gerar Zé dinâmico]')
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip fonts-dejavu-core curl >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.8,<2' pillow 'faster-whisper>=1.1,<2' numpy >/dev/null
          git fetch origin ze-curioso-v24:refs/remotes/origin/ze-curioso-v24
          python -m py_compile \
            cloud/ze_postavel_woodfrog_final.py \
            cloud/ze_postavel_woodfrog_card_sync.py \
            cloud/ze_postavel_woodfrog_continuous_bubble.py \
            cloud/ze_postavel_woodfrog_scene_voice_bubble_v4.py \
            cloud/ze_postavel_woodfrog_voice_v6_single_take.py \
            cloud/ze_postavel_woodfrog_voice_v6_retry.py \
            cloud/ze_postavel_woodfrog_voice_v6_2_final.py \
            cloud/ze_postavel_woodfrog_voice_v6_3_calm.py \
            cloud/ze_postavel_woodfrog_v6_4_locked.py \
            cloud/ze_postavel_woodfrog_v6_4_finalsplit.py \
            cloud/ze_postavel_woodfrog_v6_4_carrierfix.py \
            cloud/ze_postavel_woodfrog_v6_4_finalpolish.py \
            cloud/ze_postavel_woodfrog_v6_4_simplebubble.py \
            cloud/ze_postavel_woodfrog_v6_4_voicefixed_simplebubble.py \
            cloud/ze_studio_dynamic.py \
            cloud/ze_studio_dynamic_prod.py

      - name: Resolve episode and render approved template
        env:
          GH_TOKEN: ${{ github.token }}
          ZE_REQUEST_JSON: ${{ github.event.issue.body }}
        run: python cloud/ze_studio_dynamic_prod.py

      - name: Upload dynamic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ze-studio-DYNAMIC-${{ github.run_id }}
          path: |
            post_final/ze_curioso_final.mp4
            post_final/capa_final.jpg
            post_final/copy_postagem.txt
            post_final/roteiro.txt
            post_final/episode.json
            post_final/qa.json
            post_final/word_bubble_timing.json
            post_final/asr_transcript.txt
            post_final/voice_consistency.json
            post_final/signoff_qa.json
            post_final/final_voice_architecture.json
            post_final/audio/narration_continuous.wav
            post_final/audio/signoff_final.wav
            post_final/scenes/scene_*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Comment issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Zé Studio dinâmico concluído. Artifact: **ze-studio-DYNAMIC-${context.runId}**\n\n${runUrl}`
                : `❌ Zé Studio dinâmico falhou/reprovou. Logs:\n\n${runUrl}`
            });
