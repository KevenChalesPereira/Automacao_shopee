name: Render Shopee V22.1 — Core Estável + QA

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID do job"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --break-system-packages edge-tts pillow

      - name: Render
        run: |
          mkdir -p resultado
          python3 cloud/render_v22.py "jobs/${{ inputs.job_id }}" resultado

      - name: QA automático
        if: always()
        run: |
          python3 qa_agent.py --output-dir resultado || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v22-${{ inputs.job_id }}
          path: |
            resultado/anuncio_final.mp4
            resultado/produto.json
            resultado/legendas_shopee.ass
            resultado/copie_e_cole_na_live.txt
            resultado/banner_story.png
            resultado/banner_feed.png
            resultado/capa_video.png
            resultado/roteiro_narracao.txt
            resultado/analise_produto.json
            resultado/analise_produto_vision.json
            resultado/diagnostico_render.json
            resultado/qa_report.json
            resultado/qa_report.txt
            resultado/qa_contact_sheet.jpg
          if-no-files-found: ignore
          retention-days: 1
