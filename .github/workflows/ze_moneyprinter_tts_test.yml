name: Ze Curioso - MoneyPrinter TTS Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-moneyprinter-tts:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste MoneyPrinter TTS]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install requests

      - name: Testar 4 vozes pt-BR do MoneyPrinter
        run: python cloud/moneyprinter_tts_test.py

      - name: Upload das vozes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze-moneyprinter-tts-${{ github.run_id }}
          path: moneyprinter_tts_test/
          if-no-files-found: error
          retention-days: 7

      - name: Comentar issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Teste MoneyPrinter TTS concluído. Baixe o artifact **ze-moneyprinter-tts-${context.runId}** para ouvir br_001, br_003, br_004 e br_005.\n\n${runUrl}`
                : `❌ O teste do MoneyPrinter TTS falhou. Logs:\n\n${runUrl}`
            });
