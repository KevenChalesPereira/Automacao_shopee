name: Ze Frog Assets

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  fetch:
    if: startsWith(github.event.issue.title, '[Fetch frog assets]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download licensed wood frog photos
        run: |
          set -euo pipefail
          mkdir -p frog_assets
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Lithobates_sylvaticus_%28wood_frog%29.jpg/1280px-Lithobates_sylvaticus_%28wood_frog%29.jpg' \
            -o frog_assets/frog_01.jpg
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Lithobates_sylvaticus_-_Wood_Frog_01.jpg/1280px-Lithobates_sylvaticus_-_Wood_Frog_01.jpg' \
            -o frog_assets/frog_02.jpg
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Wood_Frog_%28Lithobates_sylvaticus%29.jpg/1280px-Wood_Frog_%28Lithobates_sylvaticus%29.jpg' \
            -o frog_assets/frog_03.jpg
          file frog_assets/*
          test -s frog_assets/frog_01.jpg
          test -s frog_assets/frog_02.jpg
          test -s frog_assets/frog_03.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: ze-frog-assets-${{ github.run_id }}
          path: frog_assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Comment issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok ? `✅ Frog assets ready: **ze-frog-assets-${context.runId}**\n\n${runUrl}` : `❌ Frog asset fetch failed.\n\n${runUrl}`
            });
