name: Render Shopee V4

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID do job"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --break-system-packages edge-tts pillow

      - name: Render
        run: |
          mkdir -p resultado
          python3 cloud/render_v4.py "jobs/${{ inputs.job_id }}" resultado

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v4-${{ inputs.job_id }}
          path: |
            resultado/anuncio_final.mp4
            resultado/produto.json
            resultado/legendas_tiktok.ass
            resultado/copie_e_cole_na_live.txt
          retention-days: 1
