name: Ze Curioso Studio - MoneyPrinter Primary

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      theme:
        description: 'Tema opcional; vazio = MoneyPrinter escolhe tema novo'
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Gerar Zé MoneyPrinter]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip fonts-dejavu-core curl >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.8,<2' pillow 'faster-whisper>=1.1,<2' numpy requests >/dev/null
          python -m py_compile             cloud/moneyprinter_bridge.py             cloud/ze_moneyprinter_voice.py             cloud/ze_studio_dynamic.py             cloud/ze_studio_dynamic_prod.py             cloud/ze_studio_moneyprinter_prod.py

      - name: Build request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_THEME: ${{ github.event.inputs.theme }}
        run: |
          python - <<'PY'
          import json, os
          raw=(os.environ.get('ISSUE_BODY') or '').strip()
          theme=(os.environ.get('INPUT_THEME') or '').strip()
          if raw:
              try:
                  data=json.loads(raw)
              except Exception:
                  data={"mode":"moneyprinter_auto","theme":raw}
          else:
              data={"mode":"moneyprinter_auto"}
          if theme:
              data={"mode":"moneyprinter_auto","theme":theme}
          data["mode"]="moneyprinter_auto"
          open("studio_request.json","w",encoding="utf-8").write(json.dumps(data,ensure_ascii=False))
          print(json.dumps(data,ensure_ascii=False))
          PY

      - name: Render MoneyPrinter-powered Zé
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ZE_REQUEST_FILE: studio_request.json
        run: |
          unset ZE_REQUEST_JSON || true
          python cloud/ze_studio_moneyprinter_prod.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ze-moneyprinter-${{ github.run_id }}
          path: |
            post_final/ze_curioso_final.mp4
            post_final/capa_final.jpg
            post_final/copy_postagem.txt
            post_final/roteiro.txt
            post_final/episode.json
            post_final/qa.json
            post_final/moneyprinter_pipeline.json
            post_final/word_bubble_timing.json
            post_final/asr_transcript.txt
            post_final/voice_consistency.json
            post_final/signoff_qa.json
            post_final/final_voice_architecture.json
            post_final/audio/narration_continuous.wav
            post_final/audio/signoff_final.wav
            post_final/audio/*moneyprinter*
            post_final/scenes/scene_*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Comment issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Zé Curioso com MoneyPrinter como motor principal concluído. Artifact **ze-moneyprinter-${context.runId}**\n\n${runUrl}`
                : `❌ Pipeline MoneyPrinter/Zé falhou. Logs:\n\n${runUrl}`
            });
