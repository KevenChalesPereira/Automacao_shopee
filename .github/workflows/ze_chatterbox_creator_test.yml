name: Ze Curioso Chatterbox Creator PT-BR Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: startsWith(github.event.issue.title, '[Teste Chatterbox]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clients and build pt-BR male reference
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.8,<2' edge-tts >/dev/null
          mkdir -p resultado_chatterbox
          edge-tts --voice pt-BR-AntonioNeural --rate=-2% --pitch=-2Hz \
            --text 'Olha só que curioso. Tem coisa na natureza que parece inventada, mas é real. E quando você entende o motivo, fica ainda mais interessante.' \
            --write-media ref_ptbr_male.mp3
          test -s ref_ptbr_male.mp3

      - name: Generate expressive PT-BR samples
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re, shutil
          from pathlib import Path
          from gradio_client import Client, handle_file

          body=os.environ.get('ISSUE_BODY','')
          m=re.search(r'### Texto\s*\n+(.+?)(?:\n### |\Z)',body,re.S)
          text=(m.group(1).strip() if m else body.strip()) or (
              'Se liga nessa: o polvo tem três corações. Dois bombeiam sangue para as brânquias, '
              'enquanto o terceiro manda sangue oxigenado para o resto do corpo. E tem mais: quando '
              'ele nada, esse coração principal desacelera. Curioso demais, né?'
          )
          text=text[:290]
          out=Path('resultado_chatterbox')
          profiles=[
              ('natural_viva',0.65,0.78,0.40,23),
              ('criador',0.90,0.84,0.32,41),
              ('criador_mais_animado',1.20,0.88,0.25,73),
          ]

          notes=['Texto: '+text,
                 'Motor: ResembleAI/Chatterbox-Multilingual-TTS-pt-br',
                 'Referencia: pt-BR-AntonioNeural SOMENTE como identidade masculina/pt-BR; prosodia alterada pelo Chatterbox.',
                 '']
          client=Client('ResembleAI/Chatterbox-Multilingual-TTS-pt-br', verbose=False)
          ref=handle_file('ref_ptbr_male.mp3')
          generated=0

          for label,exag,temp,cfg,seed in profiles:
              print('[>]',label,'exag',exag,'temp',temp,'cfg',cfg)
              try:
                  res=client.predict(text,ref,exag,temp,seed,cfg,api_name='/generate_tts_audio')
                  src=Path(res)
                  if not src.exists() or src.stat().st_size < 1000:
                      raise RuntimeError(f'audio invalido: {res!r}')
                  suffix=src.suffix.lower() if src.suffix else '.wav'
                  dst=out/f'ze_chatterbox_{label}{suffix}'
                  shutil.copy2(src,dst)
                  notes.append(f'{label}: exaggeration={exag}, temperature={temp}, cfg={cfg}, seed={seed} -> {dst.name} ({dst.stat().st_size} bytes)')
                  generated += 1
                  print('[OK]',dst,dst.stat().st_size)
              except Exception as e:
                  notes.append(f'{label}: FALHOU {type(e).__name__}: {e}')
                  print('[!]',label,type(e).__name__,e)

          notes += ['',f'Total gerado: {generated}']
          (out/'README.txt').write_text('\n'.join(notes),encoding='utf-8')
          if generated == 0:
              raise RuntimeError('Nenhuma amostra Chatterbox gerada')
          PY

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze-chatterbox-creator-${{ github.run_id }}
          path: resultado_chatterbox/*
          if-no-files-found: warn
          retention-days: 7

      - name: Comment issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Teste Chatterbox pt-BR v2 finalizado. Artifact: **ze-chatterbox-creator-${context.runId}**\n\n${runUrl}`});
