name: Ze Curioso Edge PT-BR New Voices

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste Edge novos]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install edge-tts >/dev/null
          mkdir -p resultado_edge

      - name: Gerar seis vozes masculinas pt-BR novas
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import asyncio, os, re
          from pathlib import Path
          import edge_tts

          body=os.environ.get('ISSUE_BODY','')
          m=re.search(r'### Texto\s*\n+(.+?)(?:\n### |\Z)',body,re.S)
          text=(m.group(1).strip() if m else body.strip()) or (
            'Se liga nessa, curioso! O polvo tem três corações: dois bombeiam sangue para as brânquias '
            'e um para o resto do corpo. O terceiro distribui sangue oxigenado aos músculos e aos órgãos. '
            'Agora você sabe! Bora pra próxima com o Zé!'
          )
          voices=[
            ('donato','pt-BR-DonatoNeural'),
            ('fabio','pt-BR-FabioNeural'),
            ('humberto','pt-BR-HumbertoNeural'),
            ('julio','pt-BR-JulioNeural'),
            ('nicolau','pt-BR-NicolauNeural'),
            ('valerio','pt-BR-ValerioNeural'),
          ]
          out=Path('resultado_edge')

          async def main():
            notes=['Texto: '+text,'Comparacao crua: mesmo texto, rate +4%, pitch 0Hz. Antonio nao incluido.','']
            for slug,voice in voices:
              dst=out/f'ze_edge_{slug}.mp3'
              print('[>]',voice)
              c=edge_tts.Communicate(text,voice=voice,rate='+4%',pitch='+0Hz',volume='+0%')
              await c.save(str(dst))
              if not dst.exists() or dst.stat().st_size < 1000:
                raise RuntimeError(f'Arquivo invalido: {dst}')
              print('[OK]',dst,dst.stat().st_size)
              notes.append(f'{slug}: {voice}')
            (out/'README.txt').write_text('\n'.join(notes),encoding='utf-8')
          asyncio.run(main())
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-edge-ptbr-new-${{ github.run_id }}
          path: resultado_edge/*
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?`✅ Seis vozes novas pt-BR geradas. Artifact: **ze-edge-ptbr-new-${context.runId}**\n\n${runUrl}`:`❌ Teste Edge novos falhou. Logs: ${runUrl}`});
