name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.3.0' 'datasets>=3.0.0' pyarrow >/dev/null
          mkdir -p /tmp/ze_refs resultado_voice

      - name: Selecionar 3 referências masculinas nordestinas jovens
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from datasets import load_dataset, Audio
          import subprocess, json

          ds = load_dataset('remynd/common_voice_pt_pt', split='train').cast_column('audio', Audio(decode=False))
          groups=defaultdict(list)
          for row in ds:
              accent=str(row.get('accents') or '').lower()
              gender=str(row.get('gender') or '').lower()
              age=str(row.get('age') or '').lower()
              if 'nordestino' not in accent:
                  continue
              if gender and gender not in {'male','masculino'}:
                  continue
              # Prioriza vozes jovens; aceita idade vazia como fallback.
              if age and age not in {'teens','twenties','thirties','adolescente','vinte','trinta'}:
                  continue
              d=int(row.get('duration[ms]') or 0)
              if 1800 <= d <= 6500:
                  groups[row.get('client_id')].append((d,row))

          ranked=[]
          for cid,rows in groups.items():
              total=sum(d for d,_ in rows)
              if len(rows)>=2 and total>=6500:
                  sample=rows[0][1]
                  ranked.append((total,len(rows),cid,str(sample.get('age') or ''),str(sample.get('gender') or ''),rows))
          ranked.sort(reverse=True,key=lambda x:(x[0],x[1]))

          # Não reutiliza a referência rouca já testada antes.
          banned={'63850bd9f5d888281e47a93004a0102ecb6716fe914b905b4d3cde0d89eb248ebdfdc7e9499e1c170495e3ddfee31ffd72df908f05ccd6748acc2ad8a4422817'}
          ranked=[x for x in ranked if x[2] not in banned]
          if len(ranked)<3:
              raise RuntimeError(f'Poucas referências jovens nordestinas elegíveis: {len(ranked)}')

          manifest=[]
          for idx,(_,_,cid,age,gender,rows) in enumerate(ranked[:3],1):
              rows=sorted(rows,reverse=True,key=lambda x:x[0])
              chosen=[]; total=0
              for d,row in rows:
                  chosen.append((d,row)); total+=d
                  if total>=10000 or len(chosen)>=3: break
              out=Path('/tmp/ze_refs')/f'speaker_{idx}'
              out.mkdir(parents=True,exist_ok=True)
              clips=[]
              for j,(d,row) in enumerate(chosen,1):
                  a=row['audio']; suffix=Path(a.get('path') or '').suffix or '.mp3'; p=out/f'clip_{j}{suffix}'
                  if a.get('bytes') is not None: p.write_bytes(a['bytes'])
                  else: p.write_bytes(Path(a['path']).read_bytes())
                  clips.append(p)
              concat=out/'concat.txt'
              concat.write_text(''.join(f"file '{p.as_posix()}'\n" for p in clips),encoding='utf-8')
              wav=out/'reference.wav'
              subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i',str(concat),'-ac','1','-ar','24000','-af','highpass=f=60,loudnorm=I=-18:LRA=7:TP=-2',str(wav)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              preview=Path('resultado_voice')/f'referencia_{idx}.mp3'
              subprocess.run(['ffmpeg','-y','-i',str(wav),'-c:a','libmp3lame','-q:a','3',str(preview)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              manifest.append({'idx':idx,'client_id':cid,'age':age,'gender':gender,'duration_s':round(total/1000,2),'reference':str(wav)})
              print('[REF]',idx,'age=',age,'gender=',gender,'dur=',total/1000,'cid=',cid)
          Path('/tmp/ze_refs/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('resultado_voice/referencias.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Chatterbox — clonar as 3 referências nordestinas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, time
          from gradio_client import Client, handle_file

          text=(
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )
          refs=json.loads(Path('/tmp/ze_refs/manifest.json').read_text(encoding='utf-8'))
          spaces=['ResembleAI/Chatterbox-Multilingual-TTS-pt-br','ResembleAI/Chatterbox-Multilingual-TTS']

          client=api_name=api_spec=chosen_space=None
          for space in spaces:
              try:
                  c=Client(space,verbose=False)
                  info=c.view_api(all_endpoints=True,print_info=False,return_format='dict')
                  cand=[]
                  for name,spec in info.get('named_endpoints',{}).items():
                      params=spec.get('parameters',[])
                      blob=' '.join(str(p.get('label') or p.get('parameter_name') or '') for p in params).lower()
                      score=0
                      if 'text' in blob: score+=4
                      if 'audio' in blob or 'reference' in blob: score+=4
                      if 'exagger' in blob: score+=2
                      if 'temperature' in blob: score+=2
                      if 'cfg' in blob or 'pace' in blob: score+=1
                      if 'generate' in name.lower() or 'tts' in name.lower(): score+=2
                      cand.append((score,name,spec))
                  cand.sort(reverse=True,key=lambda x:x[0])
                  if not cand or cand[0][0]<8: raise RuntimeError('endpoint TTS inadequado')
                  _,api_name,api_spec=cand[0]
                  client,chosen_space=c,space
                  print('[OK] Space',space,api_name)
                  break
              except Exception as e:
                  print('[!] Space falhou',space,e)
          if client is None: raise RuntimeError('Chatterbox indisponível')

          def find_file(obj):
              if isinstance(obj,str):
                  p=Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj,dict):
                  for k in ('path','name','value'):
                      v=obj.get(k)
                      if isinstance(v,str):
                          p=Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r=find_file(v)
                      if r:return r
              if isinstance(obj,(list,tuple)):
                  for v in obj:
                      r=find_file(v)
                      if r:return r
              return None

          params=api_spec.get('parameters',[])
          for item in refs:
              reference=handle_file(item['reference'])
              cfg={'exaggeration':0.68,'temperature':0.74,'cfg':0.40,'seed':31+item['idx']*17}
              def value(p):
                  label=str(p.get('label') or p.get('parameter_name') or '').lower()
                  if 'text' in label:return text[:295]
                  if 'language' in label or label.strip() in {'lang','language_id'}:return 'pt'
                  if 'reference' in label or ('audio' in label and 'output' not in label):return reference
                  if 'exagger' in label:return cfg['exaggeration']
                  if 'temperature' in label or label.strip()=='temp':return cfg['temperature']
                  if 'seed' in label:return cfg['seed']
                  if 'cfg' in label or 'pace' in label:return cfg['cfg']
                  if p.get('parameter_has_default'):return p.get('default')
                  return None
              args=[value(p) for p in params]
              last=None
              for attempt in range(1,4):
                  try:
                      result=client.predict(*args,api_name=api_name)
                      src=find_file(result)
                      if not src:raise RuntimeError(f'retorno sem áudio {result!r}')
                      dst=Path('resultado_voice')/f'nordestino_jovem_{item["idx"]}{src.suffix or ".wav"}'
                      shutil.copy2(src,dst)
                      print('[OK]',dst)
                      break
                  except Exception as e:
                      last=e; print('[!]',e)
                      if attempt<3:time.sleep(18*attempt)
              else:raise RuntimeError(f'falhou speaker {item["idx"]}: {last}')
          Path('resultado_voice/README.txt').write_text(f'3 referências masculinas nordestinas jovens + Chatterbox via {chosen_space}.\n',encoding='utf-8')
          PY

      - name: Converter resultados
        run: |
          shopt -s nullglob
          for f in resultado_voice/nordestino_jovem_*; do
            [[ "$f" == *.mp3 ]] && continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'highpass=f=60,equalizer=f=180:t=q:w=0.8:g=-0.8,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3" >/dev/null 2>&1
          done
          ls -lh resultado_voice

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-nordeste-authentic-${{ github.run_id }}
          path: |
            resultado_voice/nordestino_jovem_*.mp3
            resultado_voice/referencia_*.mp3
            resultado_voice/referencias.json
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?`✅ 3 vozes nordestinas pt-BR autênticas geradas: ${runUrl}`:`❌ Teste nordestino falhou: ${runUrl}`});
