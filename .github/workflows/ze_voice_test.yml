name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar referência nordestina autêntica
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.3.0' 'datasets>=3.0.0' pyarrow

          mkdir -p /tmp/nordestino_ref
          python - <<'PY'
          from pathlib import Path
          from datasets import load_dataset, Audio
          import subprocess

          # Mesmo locutor masculino, 30 e poucos anos, marcado explicitamente como "Nordestino"
          # no Common Voice. Usamos vários trechos do MESMO locutor para dar ao clone
          # uma referência mais longa e preservar o sotaque em vez de misturar vozes.
          TARGET = '63850bd9f5d888281e47a93004a0102ecb6716fe914b905b4d3cde0d89eb248ebdfdc7e9499e1c170495e3ddfee31ffd72df908f05ccd6748acc2ad8a4422817'
          out = Path('/tmp/nordestino_ref')

          ds = load_dataset('remynd/common_voice_pt_pt', split='train')
          ds = ds.cast_column('audio', Audio(decode=False))

          rows = []
          for row in ds:
              if row.get('client_id') != TARGET:
                  continue
              accent = str(row.get('accents') or '').lower()
              if 'nordestino' not in accent:
                  continue
              dur_ms = int(row.get('duration[ms]') or 0)
              if dur_ms < 1800:
                  continue
              rows.append((dur_ms, row))

          if not rows:
              raise SystemExit('Nenhum trecho do locutor nordestino foi encontrado.')

          # Prioriza frases mais longas. Meta: ~16–22 s de referência.
          rows.sort(reverse=True, key=lambda x: x[0])
          chosen = []
          total_ms = 0
          for dur_ms, row in rows:
              chosen.append((dur_ms, row))
              total_ms += dur_ms
              if total_ms >= 18000 or len(chosen) >= 5:
                  break

          clip_paths = []
          for i, (dur_ms, row) in enumerate(chosen, 1):
              audio = row['audio']
              data = audio.get('bytes')
              suffix = Path(audio.get('path') or '').suffix or '.mp3'
              p = out / f'clip_{i:02d}{suffix}'
              if data is not None:
                  p.write_bytes(data)
              elif audio.get('path'):
                  src = Path(audio['path'])
                  p.write_bytes(src.read_bytes())
              else:
                  raise RuntimeError('Registro de áudio sem bytes/path.')
              clip_paths.append(p)
              print(f"[REF] {dur_ms/1000:.2f}s | {row.get('sentence')}")

          concat = out / 'concat.txt'
          concat.write_text(''.join(f"file '{p.as_posix()}'\n" for p in clip_paths), encoding='utf-8')
          ref = out / 'nordestino_male_reference.wav'
          subprocess.run([
              'ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', str(concat),
              '-ac', '1', '-ar', '24000', '-af', 'loudnorm=I=-18:LRA=7:TP=-2',
              str(ref)
          ], check=True)

          Path('/tmp/nordestino_ref_path.txt').write_text(str(ref), encoding='utf-8')
          Path('/tmp/nordestino_ref_info.txt').write_text(
              f'Common Voice speaker marcado como Nordestino; {len(chosen)} trechos; {total_ms/1000:.2f}s.\n',
              encoding='utf-8'
          )
          print(f'[OK] Referência final: {ref} ({total_ms/1000:.2f}s)')
          PY

      - name: Gerar 3 takes nordestinos Chatterbox
        run: |
          mkdir -p resultado_voice
          python - <<'PY'
          from pathlib import Path
          import shutil
          from gradio_client import Client, handle_file

          out = Path('resultado_voice')
          text = (
              'Rapaz, se liga nessa. Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina, quer saber o que tu tá fazendo '
              'e muitas vezes só quer ficar por perto. Pra ele, te acompanhar pela casa já faz parte do dia. '
              'Massa, né? Agora tu sabe!'
          )

          ref_path = Path('/tmp/nordestino_ref_path.txt').read_text(encoding='utf-8').strip()
          reference = handle_file(ref_path)

          spaces = [
              'ResembleAI/Chatterbox-Multilingual-TTS-pt-br',
              'ResembleAI/Chatterbox-Multilingual-TTS',
          ]

          client = api_name = api_spec = chosen_space = None
          for space in spaces:
              try:
                  print(f'[>] Conectando ao Space {space}...')
                  c = Client(space, verbose=False)
                  info = c.view_api(all_endpoints=True, print_info=False, return_format='dict')
                  candidates = []
                  for name, spec in info.get('named_endpoints', {}).items():
                      params = spec.get('parameters', [])
                      blob = ' '.join(str(p.get('label') or p.get('parameter_name') or '') for p in params).lower()
                      score = 0
                      if 'text' in blob: score += 4
                      if 'exagger' in blob: score += 3
                      if 'temperature' in blob: score += 2
                      if 'cfg' in blob or 'pace' in blob: score += 2
                      if 'audio' in blob or 'reference' in blob: score += 4
                      if 'generate' in name.lower() or 'tts' in name.lower(): score += 2
                      candidates.append((score, name, spec))
                  candidates.sort(reverse=True, key=lambda x: x[0])
                  if not candidates or candidates[0][0] < 7:
                      raise RuntimeError('nenhum endpoint TTS adequado')
                  _, api_name, api_spec = candidates[0]
                  client, chosen_space = c, space
                  print(f'[OK] {space} -> {api_name}')
                  break
              except Exception as e:
                  print(f'[!] Falha ao preparar {space}: {e}')

          if client is None:
              raise RuntimeError('Não foi possível acessar nenhum Space Chatterbox.')

          def param_value(p, cfg):
              label = str(p.get('label') or p.get('parameter_name') or '').lower()
              if 'text' in label:
                  return text[:295]
              if 'language' in label or label.strip() in {'lang', 'language_id'}:
                  return 'pt'
              if 'reference' in label or ('audio' in label and 'output' not in label):
                  return reference
              if 'exagger' in label:
                  return cfg['exaggeration']
              if 'temperature' in label or label.strip() == 'temp':
                  return cfg['temperature']
              if 'seed' in label:
                  return cfg['seed']
              if 'cfg' in label or 'pace' in label:
                  return cfg['cfg']
              if p.get('parameter_has_default'):
                  return p.get('default')
              return None

          def find_file(obj):
              if isinstance(obj, str):
                  p = Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj, dict):
                  for key in ('path', 'name', 'value'):
                      v = obj.get(key)
                      if isinstance(v, str):
                          p = Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      p = find_file(v)
                      if p: return p
              if isinstance(obj, (list, tuple)):
                  for v in obj:
                      p = find_file(v)
                      if p: return p
              return None

          takes = [
              ('nordeste_natural', {'exaggeration': 0.42, 'temperature': 0.66, 'cfg': 0.50, 'seed': 23}),
              ('nordeste_contador', {'exaggeration': 0.62, 'temperature': 0.74, 'cfg': 0.42, 'seed': 79}),
              ('nordeste_arretado', {'exaggeration': 0.80, 'temperature': 0.82, 'cfg': 0.36, 'seed': 131}),
          ]

          params = api_spec.get('parameters', [])
          print('[>] Parâmetros:', [p.get('label') or p.get('parameter_name') for p in params])
          for slug, cfg in takes:
              args = [param_value(p, cfg) for p in params]
              print(f'[>] Gerando {slug}...')
              result = client.predict(*args, api_name=api_name)
              src = find_file(result)
              if src is None:
                  raise RuntimeError(f'Retorno de áudio não reconhecido para {slug}: {result!r}')
              dst = out / f'{slug}{src.suffix or ".wav"}'
              shutil.copy2(src, dst)
              print(f'[OK] {dst}')

          info = Path('/tmp/nordestino_ref_info.txt').read_text(encoding='utf-8')
          (out / 'README.txt').write_text(
              f'Chatterbox via {chosen_space}.\n'
              f'Referência: {info}'
              'natural = conversa; contador = contador de causos; arretado = mais presença e energia.\n',
              encoding='utf-8'
          )
          PY

      - name: Normalizar e converter MP3
        run: |
          shopt -s nullglob
          for f in resultado_voice/nordeste_*; do
            [[ "$f" == *.mp3 ]] && continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3"
          done
          ls -lh resultado_voice

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voice-test-${{ github.run_id }}
          path: |
            resultado_voice/*.mp3
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `✅ Teste de voz nordestina autêntica do Zé gerado: ${runUrl}`
              : `❌ Teste de voz nordestina falhou: ${runUrl}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
