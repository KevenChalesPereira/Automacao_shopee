name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar dependências e referência nordestina
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.3.0' 'datasets>=3.0.0' pyarrow

          mkdir -p /tmp/nordestino_ref resultado_voice
          python - <<'PY'
          from pathlib import Path
          from datasets import load_dataset, Audio
          import subprocess

          TARGET = '63850bd9f5d888281e47a93004a0102ecb6716fe914b905b4d3cde0d89eb248ebdfdc7e9499e1c170495e3ddfee31ffd72df908f05ccd6748acc2ad8a4422817'
          out = Path('/tmp/nordestino_ref')
          ds = load_dataset('remynd/common_voice_pt_pt', split='train')
          ds = ds.cast_column('audio', Audio(decode=False))

          rows = []
          for row in ds:
              if row.get('client_id') != TARGET:
                  continue
              if 'nordestino' not in str(row.get('accents') or '').lower():
                  continue
              dur_ms = int(row.get('duration[ms]') or 0)
              if 2200 <= dur_ms <= 7000:
                  rows.append((dur_ms, row))

          if not rows:
              raise SystemExit('Nenhum trecho nordestino adequado encontrado.')

          rows.sort(reverse=True, key=lambda x: x[0])
          chosen, total_ms = [], 0
          for dur_ms, row in rows:
              chosen.append((dur_ms, row))
              total_ms += dur_ms
              if total_ms >= 14000 or len(chosen) >= 4:
                  break

          clip_paths = []
          transcript = []
          for i, (dur_ms, row) in enumerate(chosen, 1):
              audio = row['audio']
              data = audio.get('bytes')
              suffix = Path(audio.get('path') or '').suffix or '.mp3'
              p = out / f'clip_{i:02d}{suffix}'
              if data is not None:
                  p.write_bytes(data)
              elif audio.get('path'):
                  p.write_bytes(Path(audio['path']).read_bytes())
              else:
                  raise RuntimeError('Áudio sem bytes/path.')
              clip_paths.append(p)
              sentence = str(row.get('sentence') or '').strip()
              if sentence:
                  transcript.append(sentence)
              print(f'[REF] {dur_ms/1000:.2f}s | {sentence}')

          concat = out / 'concat.txt'
          concat.write_text(''.join(f"file '{p.as_posix()}'\n" for p in clip_paths), encoding='utf-8')
          ref = out / 'nordestino_reference.wav'
          subprocess.run([
              'ffmpeg','-y','-f','concat','-safe','0','-i',str(concat),
              '-ac','1','-ar','24000','-af','highpass=f=65,loudnorm=I=-18:LRA=7:TP=-2',str(ref)
          ], check=True)
          Path('/tmp/nordestino_ref_path.txt').write_text(str(ref), encoding='utf-8')
          Path('/tmp/nordestino_ref_text.txt').write_text(' '.join(transcript), encoding='utf-8')
          print(f'[OK] referência {total_ms/1000:.2f}s -> {ref}')
          PY

      - name: Qwen3-TTS — clone nordestino
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, json
          from gradio_client import Client, handle_file

          ref = Path('/tmp/nordestino_ref_path.txt').read_text().strip()
          ref_text = Path('/tmp/nordestino_ref_text.txt').read_text().strip()
          target = (
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )

          client = Client('Qwen/Qwen3-TTS', verbose=False)
          info = client.view_api(all_endpoints=True, print_info=False, return_format='dict')
          Path('resultado_voice/qwen_api.json').write_text(json.dumps(info, ensure_ascii=False, indent=2), encoding='utf-8')

          endpoints = []
          for group in ('named_endpoints','unnamed_endpoints'):
              for name, spec in info.get(group, {}).items():
                  params = spec.get('parameters', [])
                  labels = ' '.join(str(p.get('label') or p.get('parameter_name') or '') for p in params).lower()
                  score = 0
                  if 'reference audio' in labels: score += 5
                  if 'reference text' in labels: score += 4
                  if 'target text' in labels: score += 5
                  if 'model size' in labels: score += 2
                  if 'clone' in name.lower(): score += 4
                  endpoints.append((score, name, spec))
          endpoints.sort(reverse=True, key=lambda x: x[0])
          if not endpoints or endpoints[0][0] < 10:
              raise RuntimeError('Endpoint de voice clone Qwen não encontrado.')
          _, api_name, spec = endpoints[0]
          print('[QWEN] endpoint', api_name)

          args = []
          for p in spec.get('parameters', []):
              label = str(p.get('label') or p.get('parameter_name') or '').lower()
              if 'reference audio' in label:
                  args.append(handle_file(ref))
              elif 'reference text' in label:
                  args.append(ref_text)
              elif 'target text' in label:
                  args.append(target)
              elif 'language' in label:
                  args.append('Portuguese')
              elif 'x-vector' in label or 'xvector' in label:
                  args.append(False)
              elif 'model size' in label:
                  args.append('1.7B')
              elif p.get('parameter_has_default'):
                  args.append(p.get('default'))
              else:
                  args.append(None)

          result = client.predict(*args, api_name=api_name)
          print('[QWEN] result', result)

          def find_file(obj):
              if isinstance(obj, str):
                  p = Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj, dict):
                  for k in ('path','name','value'):
                      v = obj.get(k)
                      if isinstance(v, str):
                          p = Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r = find_file(v)
                      if r: return r
              if isinstance(obj, (list, tuple)):
                  for v in obj:
                      r = find_file(v)
                      if r: return r
              return None

          src = find_file(result)
          if not src:
              raise RuntimeError(f'Qwen não retornou arquivo de áudio: {result!r}')
          dst = Path('resultado_voice/qwen3_clone') .with_suffix(src.suffix or '.wav')
          shutil.copy2(src, dst)
          print('[OK]', dst)
          PY

      - name: VoxCPM2 — clone nordestino natural e animado
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from gradio_client import Client, handle_file

          ref = Path('/tmp/nordestino_ref_path.txt').read_text().strip()
          ref_text = Path('/tmp/nordestino_ref_text.txt').read_text().strip()
          target = (
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )
          client = Client('openbmb/VoxCPM-Demo', verbose=False)

          def find_file(obj):
              if isinstance(obj, str):
                  p = Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj, dict):
                  for k in ('path','name','value'):
                      v = obj.get(k)
                      if isinstance(v, str):
                          p = Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r = find_file(v)
                      if r: return r
              if isinstance(obj, (list, tuple)):
                  for v in obj:
                      r = find_file(v)
                      if r: return r
              return None

          # Controllable cloning: mantém timbre/sotaque da referência e pede uma entrega mais jovem e animada.
          style = 'Brazilian male, young adult, Northeastern Brazilian accent, natural conversational delivery, smiling, curious, lively, warm, energetic but not exaggerated, clear voice, no raspiness'
          result = client.predict(
              target,
              style,
              handle_file(ref),
              False,
              '',
              1.9,
              False,
              False,
              api_name='/generate'
          )
          src = find_file(result)
          if not src:
              raise RuntimeError(f'VoxCPM2 controlável não retornou áudio: {result!r}')
          dst = Path('resultado_voice/voxcpm2_controlled').with_suffix(src.suffix or '.wav')
          shutil.copy2(src, dst)
          print('[OK]', dst)

          # Ultimate cloning: mesma referência + transcrição para medir fidelidade pura ao locutor.
          result2 = client.predict(
              target,
              '',
              handle_file(ref),
              True,
              ref_text,
              2.0,
              False,
              False,
              api_name='/generate'
          )
          src2 = find_file(result2)
          if not src2:
              raise RuntimeError(f'VoxCPM2 ultimate não retornou áudio: {result2!r}')
          dst2 = Path('resultado_voice/voxcpm2_ultimate').with_suffix(src2.suffix or '.wav')
          shutil.copy2(src2, dst2)
          print('[OK]', dst2)
          PY

      - name: Normalizar resultados e converter MP3
        run: |
          shopt -s nullglob
          found=0
          for f in resultado_voice/qwen3_clone.* resultado_voice/voxcpm2_controlled.* resultado_voice/voxcpm2_ultimate.*; do
            [[ "$f" == *.mp3 ]] && continue
            [[ -f "$f" ]] || continue
            found=1
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'highpass=f=65,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3"
          done
          if [[ $found -eq 0 ]] && ! ls resultado_voice/*.mp3 >/dev/null 2>&1; then
            echo 'Nenhum motor conseguiu gerar áudio.' >&2
            exit 1
          fi
          ls -lh resultado_voice

      - name: README do duelo
        run: |
          cat > resultado_voice/README.txt <<'EOF'
          Duelo de voz Zé Curioso: Qwen3-TTS x VoxCPM2.
          Mesma referência masculina nordestina e mesmo roteiro em todos os takes.
          qwen3_clone = Qwen3-TTS 1.7B Base voice clone.
          voxcpm2_controlled = VoxCPM2 com referência + direção de estilo jovem/natural/animada.
          voxcpm2_ultimate = VoxCPM2 com referência + transcrição exata, priorizando fidelidade ao locutor.
          EOF

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voice-duel-${{ github.run_id }}
          path: |
            resultado_voice/*.mp3
            resultado_voice/*.txt
            resultado_voice/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `✅ Duelo Qwen3-TTS x VoxCPM2 concluído: ${runUrl}`
              : `❌ Duelo de voz falhou: ${runUrl}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
