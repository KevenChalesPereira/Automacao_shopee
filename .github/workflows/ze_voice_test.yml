name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar dependências e referência nordestina
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.3.0' 'datasets>=3.0.0' pyarrow
          mkdir -p /tmp/nordestino_ref resultado_voice
          python - <<'PY'
          from pathlib import Path
          from datasets import load_dataset, Audio
          import subprocess

          TARGET = '63850bd9f5d888281e47a93004a0102ecb6716fe914b905b4d3cde0d89eb248ebdfdc7e9499e1c170495e3ddfee31ffd72df908f05ccd6748acc2ad8a4422817'
          out = Path('/tmp/nordestino_ref')
          ds = load_dataset('remynd/common_voice_pt_pt', split='train')
          ds = ds.cast_column('audio', Audio(decode=False))
          rows = []
          for row in ds:
              if row.get('client_id') != TARGET:
                  continue
              if 'nordestino' not in str(row.get('accents') or '').lower():
                  continue
              dur_ms = int(row.get('duration[ms]') or 0)
              if 2200 <= dur_ms <= 7000:
                  rows.append((dur_ms, row))
          if not rows:
              raise SystemExit('Nenhum trecho nordestino adequado encontrado.')
          rows.sort(reverse=True, key=lambda x: x[0])
          chosen, total_ms = [], 0
          for dur_ms, row in rows:
              chosen.append((dur_ms, row))
              total_ms += dur_ms
              if total_ms >= 14000 or len(chosen) >= 4:
                  break
          clip_paths, transcript = [], []
          for i, (dur_ms, row) in enumerate(chosen, 1):
              audio = row['audio']
              data = audio.get('bytes')
              suffix = Path(audio.get('path') or '').suffix or '.mp3'
              p = out / f'clip_{i:02d}{suffix}'
              if data is not None:
                  p.write_bytes(data)
              elif audio.get('path'):
                  p.write_bytes(Path(audio['path']).read_bytes())
              else:
                  raise RuntimeError('Áudio sem bytes/path.')
              clip_paths.append(p)
              sentence = str(row.get('sentence') or '').strip()
              if sentence:
                  transcript.append(sentence)
              print(f'[REF] {dur_ms/1000:.2f}s | {sentence}')
          concat = out / 'concat.txt'
          concat.write_text(''.join(f"file '{p.as_posix()}'\n" for p in clip_paths), encoding='utf-8')
          ref = out / 'nordestino_reference.wav'
          subprocess.run([
              'ffmpeg','-y','-f','concat','-safe','0','-i',str(concat),
              '-ac','1','-ar','24000','-af','highpass=f=65,loudnorm=I=-18:LRA=7:TP=-2',str(ref)
          ], check=True)
          Path('/tmp/nordestino_ref_path.txt').write_text(str(ref), encoding='utf-8')
          Path('/tmp/nordestino_ref_text.txt').write_text(' '.join(transcript), encoding='utf-8')
          print(f'[OK] referência {total_ms/1000:.2f}s -> {ref}')
          PY

      - name: VoxCPM2 — aguardar fila e gerar dois takes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, time
          from gradio_client import Client, handle_file

          ref = Path('/tmp/nordestino_ref_path.txt').read_text().strip()
          ref_text = Path('/tmp/nordestino_ref_text.txt').read_text().strip()
          target = (
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )
          style = (
              'Brazilian male, young adult, authentic Northeastern Brazilian accent, natural conversational delivery, '
              'smiling while speaking, curious storyteller, lively and warm, medium-fast rhythm, varied intonation, '
              'clear bright voice, no raspiness, no hoarse voice, energetic but never theatrical'
          )
          client = Client('openbmb/VoxCPM-Demo', verbose=False)

          def find_file(obj):
              if isinstance(obj, str):
                  p = Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj, dict):
                  for k in ('path','name','value'):
                      v = obj.get(k)
                      if isinstance(v, str):
                          p = Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r = find_file(v)
                      if r: return r
              if isinstance(obj, (list, tuple)):
                  for v in obj:
                      r = find_file(v)
                      if r: return r
              return None

          def predict_retry(label, args, attempts=12):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      print(f'[{label}] tentativa {attempt}/{attempts}')
                      return client.predict(*args, api_name='/generate')
                  except Exception as exc:
                      last = exc
                      msg = str(exc)
                      print(f'[{label}] falhou: {msg}')
                      if attempt == attempts:
                          break
                      # Fila ZeroGPU oscila bastante; espera progressivamente sem abandonar o teste.
                      delay = min(15 + attempt * 8, 60)
                      print(f'[{label}] aguardando {delay}s...')
                      time.sleep(delay)
              raise RuntimeError(f'{label} falhou após {attempts} tentativas: {last}')

          controlled_args = [
              target, style, handle_file(ref), False, '', 1.85, False, False
          ]
          result = predict_retry('CONTROLLED', controlled_args)
          src = find_file(result)
          if not src:
              raise RuntimeError(f'VoxCPM2 controlável não retornou áudio: {result!r}')
          dst = Path('resultado_voice/voxcpm2_controlled').with_suffix(src.suffix or '.wav')
          shutil.copy2(src, dst)
          print('[OK]', dst)

          # Segunda versão prioriza a identidade/sotaque da referência e mantém a entrega natural.
          ultimate_args = [
              target, '', handle_file(ref), True, ref_text, 1.95, False, False
          ]
          result2 = predict_retry('ULTIMATE', ultimate_args)
          src2 = find_file(result2)
          if not src2:
              raise RuntimeError(f'VoxCPM2 ultimate não retornou áudio: {result2!r}')
          dst2 = Path('resultado_voice/voxcpm2_ultimate').with_suffix(src2.suffix or '.wav')
          shutil.copy2(src2, dst2)
          print('[OK]', dst2)
          PY

      - name: Normalizar resultados e converter MP3
        run: |
          shopt -s nullglob
          for f in resultado_voice/voxcpm2_controlled.* resultado_voice/voxcpm2_ultimate.*; do
            [[ "$f" == *.mp3 ]] && continue
            [[ -f "$f" ]] || continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'highpass=f=65,equalizer=f=180:t=q:w=0.8:g=-1.2,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3"
          done
          ls -lh resultado_voice/*.mp3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voxcpm2-retry-${{ github.run_id }}
          path: resultado_voice/*.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok ? `✅ VoxCPM2 gerado com retry: ${runUrl}` : `❌ VoxCPM2 ainda falhou: ${runUrl}`
            });
