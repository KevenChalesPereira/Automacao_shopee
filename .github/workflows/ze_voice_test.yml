name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.3.0' 'datasets>=3.0.0' pyarrow >/dev/null
          mkdir -p /tmp/ze_refs resultado_voice

      - name: Preparar 3 amostras do mesmo locutor nordestino
        run: |
          python - <<'PY'
          from pathlib import Path
          from datasets import load_dataset, Audio
          import subprocess, json

          TARGET='63850bd9f5d888281e47a93004a0102ecb6716fe914b905b4d3cde0d89eb248ebdfdc7e9499e1c170495e3ddfee31ffd72df908f05ccd6748acc2ad8a4422817'
          ds=load_dataset('remynd/common_voice_pt_pt',split='train').cast_column('audio',Audio(decode=False))
          rows=[]
          for row in ds:
              if row.get('client_id')!=TARGET: continue
              if 'nordestino' not in str(row.get('accents') or '').lower(): continue
              d=int(row.get('duration[ms]') or 0)
              if 3500<=d<=7500: rows.append((d,row))
          rows.sort(reverse=True,key=lambda x:x[0])
          if len(rows)<3: raise RuntimeError(f'Só achei {len(rows)} clipes adequados')

          manifest=[]
          for idx,(d,row) in enumerate(rows[:3],1):
              a=row['audio']; suffix=Path(a.get('path') or '').suffix or '.mp3'
              raw=Path('/tmp/ze_refs')/f'raw_{idx}{suffix}'
              if a.get('bytes') is not None: raw.write_bytes(a['bytes'])
              else: raw.write_bytes(Path(a['path']).read_bytes())

              # Preserva o sotaque, mas clareia o timbre antes da clonagem: menos grave/rouquidão e pitch discretamente maior.
              cleaned=Path('/tmp/ze_refs')/f'ref_{idx}.wav'
              pitch={1:1.025,2:1.040,3:1.055}[idx]
              af=(
                  f'highpass=f=85,'
                  f'equalizer=f=170:t=q:w=0.9:g=-2.2,'
                  f'equalizer=f=3200:t=q:w=1.0:g=1.8,'
                  f'rubberband=pitch={pitch}:transients=smooth,'
                  f'loudnorm=I=-18:LRA=6:TP=-2'
              )
              subprocess.run(['ffmpeg','-y','-i',str(raw),'-ac','1','-ar','24000','-af',af,str(cleaned)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              preview=Path('resultado_voice')/f'referencia_nordestina_{idx}.mp3'
              subprocess.run(['ffmpeg','-y','-i',str(cleaned),'-c:a','libmp3lame','-q:a','3',str(preview)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              manifest.append({'idx':idx,'duration_s':round(d/1000,2),'pitch_ref':pitch,'reference':str(cleaned),'sentence':str(row.get('sentence') or '')})
              print('[REF]',idx,d/1000,'s',row.get('sentence'))
          Path('/tmp/ze_refs/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('resultado_voice/referencias.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Chatterbox — 3 versões limpas e naturais
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, time
          from gradio_client import Client, handle_file

          text=(
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )
          refs=json.loads(Path('/tmp/ze_refs/manifest.json').read_text(encoding='utf-8'))
          spaces=['ResembleAI/Chatterbox-Multilingual-TTS-pt-br','ResembleAI/Chatterbox-Multilingual-TTS']

          client=api_name=api_spec=chosen_space=None
          for space in spaces:
              try:
                  c=Client(space,verbose=False)
                  info=c.view_api(all_endpoints=True,print_info=False,return_format='dict')
                  cand=[]
                  for name,spec in info.get('named_endpoints',{}).items():
                      params=spec.get('parameters',[])
                      blob=' '.join(str(p.get('label') or p.get('parameter_name') or '') for p in params).lower()
                      score=(4 if 'text' in blob else 0)+(4 if ('audio' in blob or 'reference' in blob) else 0)+(2 if 'exagger' in blob else 0)+(2 if 'temperature' in blob else 0)+(1 if ('cfg' in blob or 'pace' in blob) else 0)+(2 if ('generate' in name.lower() or 'tts' in name.lower()) else 0)
                      cand.append((score,name,spec))
                  cand.sort(reverse=True,key=lambda x:x[0])
                  if not cand or cand[0][0]<8: raise RuntimeError('endpoint inadequado')
                  _,api_name,api_spec=cand[0]; client,chosen_space=c,space; print('[OK]',space,api_name); break
              except Exception as e: print('[!]',space,e)
          if client is None: raise RuntimeError('Chatterbox indisponível')

          def find_file(obj):
              if isinstance(obj,str):
                  p=Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj,dict):
                  for k in ('path','name','value'):
                      v=obj.get(k)
                      if isinstance(v,str):
                          p=Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r=find_file(v)
                      if r:return r
              if isinstance(obj,(list,tuple)):
                  for v in obj:
                      r=find_file(v)
                      if r:return r
              return None

          params=api_spec.get('parameters',[])
          settings=[
              {'exaggeration':0.58,'temperature':0.68,'cfg':0.44,'seed':51},
              {'exaggeration':0.66,'temperature':0.72,'cfg':0.40,'seed':77},
              {'exaggeration':0.74,'temperature':0.76,'cfg':0.37,'seed':103},
          ]
          for item,cfg in zip(refs,settings):
              reference=handle_file(item['reference'])
              def val(p):
                  label=str(p.get('label') or p.get('parameter_name') or '').lower()
                  if 'text' in label:return text[:295]
                  if 'language' in label or label.strip() in {'lang','language_id'}:return 'pt'
                  if 'reference' in label or ('audio' in label and 'output' not in label):return reference
                  if 'exagger' in label:return cfg['exaggeration']
                  if 'temperature' in label or label.strip()=='temp':return cfg['temperature']
                  if 'seed' in label:return cfg['seed']
                  if 'cfg' in label or 'pace' in label:return cfg['cfg']
                  if p.get('parameter_has_default'):return p.get('default')
                  return None
              args=[val(p) for p in params]
              last=None
              for attempt in range(1,4):
                  try:
                      result=client.predict(*args,api_name=api_name)
                      src=find_file(result)
                      if not src: raise RuntimeError(f'sem áudio: {result!r}')
                      dst=Path('resultado_voice')/f'ze_nordestino_refinado_{item["idx"]}{src.suffix or ".wav"}'
                      shutil.copy2(src,dst); print('[OK]',dst); break
                  except Exception as e:
                      last=e; print('[!]',e)
                      if attempt<3: time.sleep(15*attempt)
              else: raise RuntimeError(f'falhou versão {item["idx"]}: {last}')
          Path('resultado_voice/README.txt').write_text(f'3 takes Chatterbox com o mesmo locutor nordestino real; referência tratada para timbre mais jovem/limpo. Space: {chosen_space}.\n',encoding='utf-8')
          PY

      - name: Finalizar MP3
        run: |
          shopt -s nullglob
          for f in resultado_voice/ze_nordestino_refinado_*; do
            [[ "$f" == *.mp3 ]] && continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'highpass=f=65,equalizer=f=180:t=q:w=0.8:g=-1.0,equalizer=f=3500:t=q:w=1.1:g=1.2,loudnorm=I=-16:LRA=6:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3" >/dev/null 2>&1
          done
          ls -lh resultado_voice

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-nordeste-refinado-${{ github.run_id }}
          path: |
            resultado_voice/ze_nordestino_refinado_*.mp3
            resultado_voice/referencia_nordestina_*.mp3
            resultado_voice/referencias.json
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?`✅ Zé nordestino refinado gerado: ${runUrl}`:`❌ Refinamento nordestino falhou: ${runUrl}`});
