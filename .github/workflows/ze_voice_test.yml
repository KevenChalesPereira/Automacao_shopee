name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.3.0' 'datasets>=3.0.0' pyarrow >/dev/null
          mkdir -p /tmp/ze_ref resultado_voice

      - name: Preparar referência nordestina SEM equalização
        run: |
          python - <<'PY'
          from pathlib import Path
          from datasets import load_dataset, Audio
          import subprocess

          TARGET='63850bd9f5d888281e47a93004a0102ecb6716fe914b905b4d3cde0d89eb248ebdfdc7e9499e1c170495e3ddfee31ffd72df908f05ccd6748acc2ad8a4422817'
          ds=load_dataset('remynd/common_voice_pt_pt',split='train').cast_column('audio',Audio(decode=False))
          rows=[]
          for row in ds:
              if row.get('client_id')!=TARGET: continue
              if 'nordestino' not in str(row.get('accents') or '').lower(): continue
              d=int(row.get('duration[ms]') or 0)
              if 3500<=d<=8000: rows.append((d,row))
          rows.sort(reverse=True,key=lambda x:x[0])
          if not rows: raise RuntimeError('Referência nordestina não encontrada')
          d,row=rows[0]
          a=row['audio']; suffix=Path(a.get('path') or '').suffix or '.mp3'
          raw=Path('/tmp/ze_ref')/f'raw{suffix}'
          if a.get('bytes') is not None: raw.write_bytes(a['bytes'])
          else: raw.write_bytes(Path(a['path']).read_bytes())
          ref=Path('/tmp/ze_ref/reference.wav')
          # Só converte formato/sample rate. Nenhum EQ, pitch ou formant.
          subprocess.run(['ffmpeg','-y','-i',str(raw),'-ac','1','-ar','16000',str(ref)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          Path('/tmp/ze_ref/transcript.txt').write_text(str(row.get('sentence') or '').strip(),encoding='utf-8')
          print('[REF]',d/1000,'s -',row.get('sentence'))
          PY

      - name: VoxCPM2 — IA controla timbre estilo e prosódia
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, time
          from gradio_client import Client, handle_file

          target=(
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )
          ref='/tmp/ze_ref/reference.wav'
          ref_text=Path('/tmp/ze_ref/transcript.txt').read_text(encoding='utf-8').strip()
          spaces=['OpenBMB/VoxCPM-Demo','meas123/voxcpm2-demo']

          styles=[
              ('voxcpm2_nordeste_natural',
               'Homem brasileiro jovem do Nordeste, fala espontânea de conversa, sotaque nordestino natural e perceptível, voz limpa e clara, nada rouca, calorosa, sorridente, ritmo natural, expressivo sem parecer locutor.'),
              ('voxcpm2_nordeste_animado',
               'Homem brasileiro jovem do Nordeste, criador de conteúdo curto, sotaque nordestino natural, voz leve e clara, alegre e curiosa, energia moderada, entonação variada, começa chamando atenção e termina sorrindo, sem caricatura e sem rouquidão.'),
              ('voxcpm2_nordeste_contador',
               'Homem brasileiro jovem nordestino contando um causo para um amigo, sotaque regional autêntico, voz limpa e jovial, natural, simpática e envolvente, pequenas pausas humanas, sem voz de rádio, sem rouquidão.')
          ]

          def find_file(obj):
              if isinstance(obj,str):
                  p=Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj,dict):
                  for k in ('path','name','value'):
                      v=obj.get(k)
                      if isinstance(v,str):
                          p=Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r=find_file(v)
                      if r:return r
              if isinstance(obj,(list,tuple)):
                  for v in obj:
                      r=find_file(v)
                      if r:return r
              return None

          def endpoint_score(name,spec):
              params=spec.get('parameters',[])
              blob=' '.join(str(p.get('label') or p.get('parameter_name') or '') for p in params).lower()
              score=0
              if 'text' in blob: score+=5
              if 'audio' in blob or 'reference' in blob or 'prompt' in blob: score+=5
              if 'control' in blob or 'instruction' in blob or 'style' in blob: score+=5
              if 'clone' in name.lower() or 'generate' in name.lower() or 'tts' in name.lower(): score+=3
              return score

          def choose_endpoint(info):
              cand=[]
              for group in ('named_endpoints','unnamed_endpoints'):
                  for name,spec in info.get(group,{}).items():
                      cand.append((endpoint_score(name,spec),name,spec))
              cand.sort(reverse=True,key=lambda x:x[0])
              print('[API]',[(s,n) for s,n,_ in cand[:8]])
              if not cand or cand[0][0]<8: raise RuntimeError('Endpoint VoxCPM2 adequado não encontrado')
              return cand[0][1],cand[0][2]

          client=api_name=api_spec=chosen=None
          errors=[]
          for space in spaces:
              try:
                  print('[>] conectando',space)
                  c=Client(space,verbose=False)
                  info=c.view_api(all_endpoints=True,print_info=False,return_format='dict')
                  api_name,api_spec=choose_endpoint(info)
                  Path(f'resultado_voice/{space.replace("/","_")}_api.json').write_text(json.dumps(info,ensure_ascii=False,indent=2),encoding='utf-8')
                  client,chosen=c,space
                  print('[OK]',space,api_name)
                  break
              except Exception as e:
                  errors.append(f'{space}: {e}')
                  print('[!]',space,e)
          if client is None: raise RuntimeError('VoxCPM2 indisponível: '+' | '.join(errors))

          params=api_spec.get('parameters',[])
          print('[PARAMS]',[p.get('label') or p.get('parameter_name') for p in params])

          def value_for(p,style,seed):
              label=str(p.get('label') or p.get('parameter_name') or '').lower()
              # arquivos antes de text para não confundir prompt audio
              if ('audio' in label or 'wav' in label) and any(x in label for x in ('reference','prompt','clone','speaker')):
                  return handle_file(ref)
              if ('reference' in label or 'prompt' in label) and ('text' in label or 'transcript' in label):
                  return ref_text
              if 'control' in label or 'instruction' in label or 'style' in label or 'description' in label:
                  return style
              if 'target' in label and 'text' in label:
                  return target
              if label.strip() in {'text','target text','text to synthesize','input text'} or ('text' in label and not any(x in label for x in ('prompt','reference','control','instruction','description'))):
                  return target
              if 'mode' in label:
                  # preferência explícita por clonagem controlável; se componente rejeitar, o default é usado na tentativa seguinte.
                  return 'Controllable Cloning'
              if 'cfg' in label:
                  return 2.0
              if 'step' in label or 'timestep' in label:
                  return 10
              if 'seed' in label:
                  return seed
              if 'normalize' in label or 'denoise' in label:
                  return False
              if p.get('parameter_has_default'):
                  return p.get('default')
              return None

          for i,(slug,style) in enumerate(styles,1):
              args=[value_for(p,style,40+i*17) for p in params]
              last=None
              for attempt in range(1,5):
                  try:
                      print(f'[>] {slug} tentativa {attempt}/4')
                      result=client.predict(*args,api_name=api_name)
                      src=find_file(result)
                      if not src: raise RuntimeError(f'retorno sem áudio: {result!r}')
                      dst=Path('resultado_voice')/f'{slug}{src.suffix or ".wav"}'
                      shutil.copy2(src,dst); print('[OK]',dst); break
                  except Exception as e:
                      last=e; print('[!]',e)
                      # Se o valor textual do mode for incompatível, na segunda tentativa usa o default do componente.
                      if attempt==1:
                          for j,p in enumerate(params):
                              label=str(p.get('label') or p.get('parameter_name') or '').lower()
                              if 'mode' in label and p.get('parameter_has_default'):
                                  args[j]=p.get('default')
                      if attempt<4: time.sleep(30*attempt)
              else:
                  raise RuntimeError(f'{slug} falhou: {last}')

          Path('resultado_voice/README.txt').write_text(
              f'Motor: VoxCPM2 via {chosen}. A referência só foi resampleada; timbre/prosódia são controlados pelo próprio modelo.\n',encoding='utf-8')
          PY

      - name: Converter para MP3 sem alterar timbre
        run: |
          shopt -s nullglob
          for f in resultado_voice/voxcpm2_nordeste_*; do
            [[ "$f" == *.mp3 ]] && continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3" >/dev/null 2>&1
          done
          ls -lh resultado_voice/*.mp3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voxcpm2-ai-${{ github.run_id }}
          path: |
            resultado_voice/voxcpm2_nordeste_*.mp3
            resultado_voice/*_api.json
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?`✅ VoxCPM2 AI gerado: ${runUrl}`:`❌ VoxCPM2 AI falhou: ${runUrl}`});
