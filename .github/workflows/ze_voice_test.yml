name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install edge-tts >/dev/null
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          mkdir -p resultado_voice

      - name: Gerar vozes masculinas nativas pt-BR
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          import edge_tts

          text=(
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )

          async def main():
              voices = await edge_tts.list_voices()
              male=[]
              for v in voices:
                  locale=str(v.get('Locale') or '')
                  gender=str(v.get('Gender') or '')
                  if locale.lower()=='pt-br' and gender.lower()=='male':
                      male.append(v)

              if not male:
                  raise RuntimeError('Nenhuma voz masculina pt-BR encontrada no edge-tts')

              # Mantém todos os candidatos pt-BR para escolhermos a identidade fixa do Zé.
              manifest=[]
              for idx,v in enumerate(male,1):
                  voice=v['ShortName']
                  slug=voice.replace('pt-BR-','').replace('Neural','').lower()
                  out=Path('resultado_voice')/f'ptbr_{idx:02d}_{slug}.mp3'
                  # Levemente mais rápido e brilhante para Shorts/TikTok, sem alterar o sotaque.
                  tts=edge_tts.Communicate(text, voice, rate='+7%', pitch='+2Hz', volume='+0%')
                  await tts.save(str(out))
                  manifest.append({
                      'file':out.name,
                      'voice':voice,
                      'locale':v.get('Locale'),
                      'gender':v.get('Gender'),
                      'friendly_name':v.get('FriendlyName')
                  })
                  print('[OK]',voice,'->',out)

              Path('resultado_voice/vozes.json').write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8'
              )
              print('Total pt-BR masculinas:',len(manifest))

          asyncio.run(main())
          PY

      - name: Normalizar loudness
        run: |
          shopt -s nullglob
          for f in resultado_voice/ptbr_*.mp3; do
            base="${f%.mp3}"
            ffmpeg -y -i "$f" -af 'highpass=f=60,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}_final.mp3" >/dev/null 2>&1
            rm "$f"
          done
          ls -lh resultado_voice

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-ptbr-voices-${{ github.run_id }}
          path: |
            resultado_voice/*_final.mp3
            resultado_voice/vozes.json
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?`✅ Vozes nativas pt-BR do Zé geradas: ${runUrl}`:`❌ Teste pt-BR falhou: ${runUrl}`});
