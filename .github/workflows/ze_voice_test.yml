name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'gradio_client>=1.3.0' >/dev/null
          mkdir -p resultado_voice

      - name: Qwen3-TTS — criar voz jovem nordestina do Zé
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, time
          from gradio_client import Client

          target=(
              'Rapaz, se liga nessa! Tu já reparou que teu gato te segue até o banheiro? '
              'Pois é, não é só curiosidade. Ele conhece tua rotina e muitas vezes só quer ficar por perto. '
              'Pra ele, te acompanhar pela casa já faz parte do dia. Massa, né? Agora tu sabe!'
          )

          voices=[
              ('qwen_nordeste_jovem',
               'Homem brasileiro jovem, entre 22 e 28 anos, do Nordeste do Brasil. Sotaque nordestino natural e autêntico, sem caricatura. Voz clara, leve e jovem, sem rouquidão. Fala como um amigo contando uma curiosidade, sorrindo discretamente, ritmo natural e boa variação de entonação.'),
              ('qwen_contador_natural',
               'Jovem homem nordestino brasileiro, contador de causos moderno e simpático. Sotaque regional natural, voz limpa e calorosa. Conversa de forma espontânea, curiosa e envolvente, com pequenas pausas humanas e mudanças naturais de entonação. Animado sem parecer locutor ou personagem forçado. Sem voz rouca.'),
              ('qwen_tiktok_animado',
               'Criador de conteúdo brasileiro jovem do Nordeste, homem de vinte e poucos anos. Voz amigável, sorridente, clara e energética. Sotaque nordestino perceptível e natural. Narração curta para TikTok: começa chamando atenção, varia a entonação nas palavras importantes e termina com leve entusiasmo. Nada de voz de rádio, nada teatral, nada rouco.')
          ]

          client=Client('Qwen/Qwen3-TTS',verbose=False)

          def find_file(obj):
              if isinstance(obj,str):
                  p=Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj,dict):
                  for k in ('path','name','value'):
                      v=obj.get(k)
                      if isinstance(v,str):
                          p=Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      r=find_file(v)
                      if r:return r
              if isinstance(obj,(list,tuple)):
                  for v in obj:
                      r=find_file(v)
                      if r:return r
              return None

          for slug,desc in voices:
              last=None
              for attempt in range(1,5):
                  try:
                      print(f'[>] {slug} tentativa {attempt}/4')
                      result=client.predict(target,'Portuguese',desc,api_name='/generate_voice_design')
                      src=find_file(result)
                      if not src: raise RuntimeError(f'retorno sem áudio: {result!r}')
                      dst=Path('resultado_voice')/f'{slug}{src.suffix or ".wav"}'
                      shutil.copy2(src,dst)
                      print('[OK]',dst)
                      break
                  except Exception as exc:
                      last=exc
                      print('[!]',exc)
                      if attempt<4: time.sleep(20*attempt)
              else:
                  raise RuntimeError(f'{slug} falhou: {last}')
          PY

      - name: Polir áudio e converter MP3
        run: |
          shopt -s nullglob
          for f in resultado_voice/qwen_*; do
            [[ "$f" == *.mp3 ]] && continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'highpass=f=60,equalizer=f=180:t=q:w=0.8:g=-1.0,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3" >/dev/null 2>&1
          done
          ls -lh resultado_voice/*.mp3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-qwen-nordestino-${{ github.run_id }}
          path: resultado_voice/*.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?`✅ Qwen3-TTS Voice Design nordestino gerado: ${runUrl}`:`❌ Qwen3-TTS Voice Design falhou: ${runUrl}`});
