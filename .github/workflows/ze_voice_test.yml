name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ze-curioso-v24

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --break-system-packages edge-tts

      - name: Preparar roteiro fixo de teste
        run: |
          mkdir -p voice_job resultado_voice
          python3 - <<'PY'
          import json
          from pathlib import Path
          texts = [
              "Se liga nessa, curioso! Seu gato te segue até o banheiro por mais de um motivo.",
              "Curiosidade pesa bastante: você entra num lugar e ele quer conferir o que mudou.",
              "Também tem rotina. Se isso acontece sempre, ele aprende que aquele caminho faz parte do dia.",
              "E claro, ficar perto de você pode simplesmente ser companhia, hábito e atenção.",
              "No fim, não é mistério: é curiosidade, rotina e proximidade. Agora você sabe! Bora pra próxima com o Zé!",
          ]
          job = {"cenas": [{"texto": t} for t in texts], "roteiro": " ".join(texts)}
          Path("voice_job/curiosidade.json").write_text(json.dumps(job, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Gerar 4 vozes
        run: |
          python3 cloud/voice_audition.py voice_job resultado_voice

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voice-test-${{ github.run_id }}
          path: |
            resultado_voice/*.mp3
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `✅ Teste de vozes gerado: ${runUrl}`
              : `❌ Teste de vozes falhou: ${runUrl}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
