name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências Kokoro
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.4' soundfile

      - name: Gerar vozes brasileiras
        run: |
          mkdir -p resultado_voice
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          out = Path('resultado_voice')
          pipeline = KPipeline(lang_code='p', device='cpu')

          text = (
              'Se liga nessa, curioso! Seu gato te segue até o banheiro por mais de um motivo. '
              'Curiosidade pesa bastante: você entra num lugar e ele quer conferir o que mudou. '
              'Também tem rotina. Se isso acontece sempre, ele aprende que aquele caminho faz parte do dia. '
              'E claro, ficar perto de você pode simplesmente ser companhia, hábito e atenção. '
              'No fim, não é mistério: é curiosidade, rotina e proximidade. '
              'Agora você sabe! Bora pra próxima com o Zé!'
          )

          tests = [
              ('alex_natural', 'pm_alex', 1.00),
              ('alex_animado', 'pm_alex', 1.10),
              ('santa_natural', 'pm_santa', 1.00),
              ('santa_animado', 'pm_santa', 1.10),
          ]

          for slug, voice, speed in tests:
              chunks = []
              for _, _, audio in pipeline(text, voice=voice, speed=speed, split_pattern=r'(?<=[.!?])\s+'):
                  if audio is not None:
                      chunks.append(np.asarray(audio, dtype=np.float32))
              if not chunks:
                  raise RuntimeError(f'Kokoro não gerou áudio para {slug}')
              audio = np.concatenate(chunks)
              sf.write(out / f'voz_{slug}.wav', audio, 24000)
              print(f'[OK] {slug}: {voice} speed={speed} duração={len(audio)/24000:.2f}s')

          (out / 'README.txt').write_text(
              'Kokoro pt-BR: compare Alex natural/animado e Santa natural/animado.\n',
              encoding='utf-8'
          )
          PY

      - name: Normalizar e converter MP3
        run: |
          for f in resultado_voice/*.wav; do
            base="${f%.wav}"
            ffmpeg -y -i "$f" -af 'loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voice-test-${{ github.run_id }}
          path: |
            resultado_voice/*.mp3
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `✅ Teste Kokoro pt-BR gerado: ${runUrl}`
              : `❌ Teste Kokoro falhou: ${runUrl}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
