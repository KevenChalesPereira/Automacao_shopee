name: Zé Curioso Voice Test

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  voices:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Teste de voz]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar referência nordestina
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl unzip
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.3.0'

          mkdir -p /tmp/nordestino_ref
          curl -L --fail --retry 3 \
            'https://huggingface.co/datasets/frassonm/accentai_nordestino_leve/resolve/main/accentai_dataset_nordestino_01%20%281%29.zip' \
            -o /tmp/nordestino_ref.zip
          unzip -q /tmp/nordestino_ref.zip -d /tmp/nordestino_ref

          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('/tmp/nordestino_ref')
          audio = []
          for p in root.rglob('*'):
              if p.suffix.lower() not in {'.mp3', '.wav', '.flac', '.m4a', '.ogg'}:
                  continue
              try:
                  out = subprocess.check_output([
                      'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                      '-of', 'default=nw=1:nk=1', str(p)
                  ], text=True).strip()
                  dur = float(out)
                  audio.append((dur, p))
              except Exception:
                  pass

          if not audio:
              raise SystemExit('Nenhum áudio válido encontrado no dataset nordestino.')

          audio.sort(reverse=True, key=lambda x: x[0])
          dur, src = audio[0]
          Path('/tmp/nordestino_ref_path.txt').write_text(str(src), encoding='utf-8')
          print(f'[OK] Referência escolhida: {src} ({dur:.2f}s)')
          PY

      - name: Gerar 3 takes nordestinos Chatterbox
        run: |
          mkdir -p resultado_voice
          python - <<'PY'
          from pathlib import Path
          import shutil
          from gradio_client import Client, handle_file

          out = Path('resultado_voice')
          text = (
              'Se liga nessa! Já reparou que seu gato te segue até o banheiro? '
              'Não é só curiosidade. Ele conhece a sua rotina, quer saber o que você está fazendo '
              'e, muitas vezes, só quer ficar por perto. Para ele, te acompanhar pela casa faz parte do dia. '
              'Engraçado, né? Agora você sabe!'
          )

          ref_path = Path('/tmp/nordestino_ref_path.txt').read_text(encoding='utf-8').strip()
          reference = handle_file(ref_path)

          spaces = [
              'ResembleAI/Chatterbox-Multilingual-TTS-pt-br',
              'ResembleAI/Chatterbox-Multilingual-TTS',
          ]

          client = api_name = api_spec = chosen_space = None
          for space in spaces:
              try:
                  print(f'[>] Conectando ao Space {space}...')
                  c = Client(space, verbose=False)
                  info = c.view_api(all_endpoints=True, print_info=False, return_format='dict')
                  candidates = []
                  for name, spec in info.get('named_endpoints', {}).items():
                      params = spec.get('parameters', [])
                      blob = ' '.join(str(p.get('label') or p.get('parameter_name') or '') for p in params).lower()
                      score = 0
                      if 'text' in blob: score += 4
                      if 'exagger' in blob: score += 3
                      if 'temperature' in blob: score += 2
                      if 'cfg' in blob or 'pace' in blob: score += 2
                      if 'audio' in blob or 'reference' in blob: score += 3
                      if 'generate' in name.lower() or 'tts' in name.lower(): score += 2
                      candidates.append((score, name, spec))
                  candidates.sort(reverse=True, key=lambda x: x[0])
                  if not candidates or candidates[0][0] < 6:
                      raise RuntimeError('nenhum endpoint TTS adequado')
                  _, api_name, api_spec = candidates[0]
                  client, chosen_space = c, space
                  print(f'[OK] {space} -> {api_name}')
                  break
              except Exception as e:
                  print(f'[!] Falha ao preparar {space}: {e}')

          if client is None:
              raise RuntimeError('Não foi possível acessar nenhum Space Chatterbox.')

          def param_value(p, cfg):
              label = str(p.get('label') or p.get('parameter_name') or '').lower()
              if 'text' in label:
                  return text[:295]
              if 'language' in label or label.strip() in {'lang', 'language_id'}:
                  return 'pt'
              if 'reference' in label or ('audio' in label and 'output' not in label):
                  return reference
              if 'exagger' in label:
                  return cfg['exaggeration']
              if 'temperature' in label or label.strip() == 'temp':
                  return cfg['temperature']
              if 'seed' in label:
                  return cfg['seed']
              if 'cfg' in label or 'pace' in label:
                  return cfg['cfg']
              if p.get('parameter_has_default'):
                  return p.get('default')
              return None

          def find_file(obj):
              if isinstance(obj, str):
                  p = Path(obj)
                  if p.exists() and p.is_file(): return p
              if isinstance(obj, dict):
                  for key in ('path', 'name', 'value'):
                      v = obj.get(key)
                      if isinstance(v, str):
                          p = Path(v)
                          if p.exists() and p.is_file(): return p
                  for v in obj.values():
                      p = find_file(v)
                      if p: return p
              if isinstance(obj, (list, tuple)):
                  for v in obj:
                      p = find_file(v)
                      if p: return p
              return None

          takes = [
              ('nordeste_natural', {'exaggeration': 0.46, 'temperature': 0.68, 'cfg': 0.46, 'seed': 19}),
              ('nordeste_contador', {'exaggeration': 0.68, 'temperature': 0.75, 'cfg': 0.39, 'seed': 71}),
              ('nordeste_energia', {'exaggeration': 0.84, 'temperature': 0.81, 'cfg': 0.34, 'seed': 127}),
          ]

          params = api_spec.get('parameters', [])
          print('[>] Parâmetros:', [p.get('label') or p.get('parameter_name') for p in params])
          for slug, cfg in takes:
              args = [param_value(p, cfg) for p in params]
              print(f'[>] Gerando {slug}...')
              result = client.predict(*args, api_name=api_name)
              src = find_file(result)
              if src is None:
                  raise RuntimeError(f'Retorno de áudio não reconhecido para {slug}: {result!r}')
              dst = out / f'{slug}{src.suffix or ".wav"}'
              shutil.copy2(src, dst)
              print(f'[OK] {dst}')

          (out / 'README.txt').write_text(
              f'Chatterbox via {chosen_space}, condicionado por referência com sotaque nordestino leve.\n'
              f'Referência: dataset frassonm/accentai_nordestino_leve.\n'
              'natural = conversa; contador = contador de causos; energia = mais vivo.\n',
              encoding='utf-8'
          )
          PY

      - name: Normalizar e converter MP3
        run: |
          shopt -s nullglob
          for f in resultado_voice/nordeste_*; do
            [[ "$f" == *.mp3 ]] && continue
            base="${f%.*}"
            ffmpeg -y -i "$f" -af 'loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -q:a 2 "${base}.mp3"
          done
          ls -lh resultado_voice

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ze-voice-test-${{ github.run_id }}
          path: |
            resultado_voice/*.mp3
            resultado_voice/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `✅ Teste de voz nordestina do Zé gerado: ${runUrl}`
              : `❌ Teste de voz nordestina falhou: ${runUrl}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
