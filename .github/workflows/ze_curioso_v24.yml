name: Zé Curioso Studio V24 — Backend Test

on:
  push:
    branches:
      - ze-curioso-v24
    paths:
      - "cloud/render_ze_curioso_v24.py"
      - "qa_ze_curioso.py"
      - "ze_curioso_v24.py"
      - "ze_curioso_v24_2.py"
      - "examples/ze_curioso_demo.json"
      - ".github/workflows/ze_curioso_v24.yml"
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID do job já enviado para jobs/<id>/curiosidade.json"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --break-system-packages edge-tts pillow

      - name: Preparar job
        shell: bash
        run: |
          rm -rf resultado_ze
          mkdir -p resultado_ze
          INPUT_JOB="${{ inputs.job_id }}"
          if [ -n "$INPUT_JOB" ]; then
            test -f "jobs/$INPUT_JOB/curiosidade.json"
            echo "JOB_ID=$INPUT_JOB" >> "$GITHUB_ENV"
          else
            rm -rf jobs/ze-curioso-demo
            mkdir -p jobs/ze-curioso-demo
            cp examples/ze_curioso_demo.json jobs/ze-curioso-demo/curiosidade.json
            echo "JOB_ID=ze-curioso-demo" >> "$GITHUB_ENV"
          fi

      - name: Checagem de sintaxe
        run: |
          python3 -m py_compile cloud/render_ze_curioso_v24.py qa_ze_curioso.py ze_curioso_v24.py ze_curioso_v24_2.py

      - name: Render Zé Curioso V24
        run: |
          python3 cloud/render_ze_curioso_v24.py "jobs/$JOB_ID" resultado_ze

      - name: QA dedicado
        run: |
          python3 qa_ze_curioso.py --output-dir resultado_ze

      - name: Upload do protótipo testado
        uses: actions/upload-artifact@v4
        with:
          name: ze-curioso-v24-${{ env.JOB_ID }}
          path: |
            resultado_ze/anuncio_final.mp4
            resultado_ze/capa_video.png
            resultado_ze/curiosidade.json
            resultado_ze/roteiro_narracao.txt
            resultado_ze/legendas_ze_curioso.ass
            resultado_ze/diagnostico_render.json
            resultado_ze/qa_report.json
            resultado_ze/qa_report.txt
          if-no-files-found: error
          retention-days: 3
