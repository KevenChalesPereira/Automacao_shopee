name: Zé Curioso Mobile Cloud

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema / pergunta"
        required: true
        type: string

permissions:
  contents: read
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Gerar vídeo]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do motor Zé Curioso
        uses: actions/checkout@v5
        with:
          ref: ze-curioso-v24

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --break-system-packages edge-tts pillow

      - name: Extrair tema
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TOPIC: ${{ inputs.tema }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              topic = os.environ.get('MANUAL_TOPIC','').strip()
          else:
              body = os.environ.get('ISSUE_BODY','')
              m = re.search(r'### Tema / pergunta\s*\n+(.+?)(?:\n### |\Z)', body, re.S)
              topic = (m.group(1).strip() if m else body.strip())
          if not topic:
              raise SystemExit('Tema vazio.')
          Path('/tmp/topic.txt').write_text(topic, encoding='utf-8')
          print('Tema:', topic)
          PY

      - name: Montar mascote final do Zé
        run: |
          set -euo pipefail
          cat \
            assets/ze_curioso/ze_final_b64/part01.txt \
            assets/ze_curioso/ze_final_b64/part02.txt \
            assets/ze_curioso/ze_final_b64/part03c.txt \
            assets/ze_curioso/ze_final_b64/part03.txt \
            assets/ze_curioso/ze_final_b64/part04.txt \
            assets/ze_curioso/ze_final_b64/part06.txt \
            assets/ze_curioso/ze_final_b64/part07.txt \
            > /tmp/ze_main.b64
          base64 -d /tmp/ze_main.b64 > assets/ze_curioso/ze_main.png
          python3 - <<'PY'
          from PIL import Image
          p='assets/ze_curioso/ze_main.png'
          im=Image.open(p).convert('RGBA')
          if im.width < 250 or im.height < 300:
              raise SystemExit(f'Mascote com dimensões inesperadas: {im.size}')
          print('Mascote final OK:', im.size)
          PY

      - name: Gerar roteiro e backgrounds resilientes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rm -rf mobile_job resultado_mobile
          mkdir -p mobile_job resultado_mobile
          TOPIC="$(cat /tmp/topic.txt)"
          python3 ze_curioso_mobile_cloud_stable.py --tema "$TOPIC" --out-dir mobile_job

      - name: Render com voz pt-BR nativa
        run: |
          python3 cloud/render_ze_curioso_ptbr_v9.py mobile_job resultado_mobile

      - name: QA
        run: |
          python3 qa_ze_curioso.py --output-dir resultado_mobile

      - name: Registrar proveniência do run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          topic = Path('/tmp/topic.txt').read_text(encoding='utf-8').strip()
          engine_sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          bg_path = Path('mobile_job/background_provenance.json')
          backgrounds = json.loads(bg_path.read_text(encoding='utf-8')) if bg_path.exists() else {}
          data = {
              'tema': topic,
              'github_run_id': os.environ.get('RUN_ID'),
              'github_run_number': os.environ.get('RUN_NUMBER'),
              'engine_branch': 'ze-curioso-v24',
              'engine_sha': engine_sha,
              'created_at_utc': datetime.now(timezone.utc).isoformat(),
              'backgrounds': backgrounds,
          }
          out = Path('resultado_mobile/proveniencia_run.json')
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          if bg_path.exists():
              Path('resultado_mobile/background_provenance.json').write_text(bg_path.read_text(encoding='utf-8'), encoding='utf-8')
          print('Proveniência:', json.dumps(data, ensure_ascii=False))
          PY

      - name: Upload do vídeo
        uses: actions/upload-artifact@v4
        with:
          name: ze-curioso-mobile-${{ github.run_id }}
          path: |
            resultado_mobile/anuncio_final.mp4
            resultado_mobile/capa_video.png
            resultado_mobile/curiosidade.json
            resultado_mobile/roteiro_narracao.txt
            resultado_mobile/legendas_ze_curioso.ass
            resultado_mobile/diagnostico_render.json
            resultado_mobile/qa_report.json
            resultado_mobile/qa_report.txt
            resultado_mobile/proveniencia_run.json
            resultado_mobile/background_provenance.json
            mobile_job/curiosidade.json
          if-no-files-found: error
          retention-days: 7

      - name: Responder no issue
        if: ${{ github.event_name == 'issues' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `✅ Vídeo pt-BR gerado. Artifact **ze-curioso-mobile-${context.runId}**:\n\n${runUrl}`
              : `❌ A geração falhou. Abra o workflow para ver o erro:\n\n${runUrl}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
